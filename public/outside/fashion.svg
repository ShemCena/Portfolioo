<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Vignette Gradient -->
    <radialGradient id="studio-spot" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#22252e" />
      <stop offset="50%" stop-color="#12141a" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>

    <!-- Warm Amber Rim Light -->
    <linearGradient id="rim-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Wool Fabric Charcoal Gradient -->
    <linearGradient id="wool-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383b45" />
      <stop offset="40%" stop-color="#242730" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>

    <!-- Satin Lapel Reflection -->
    <linearGradient id="lapel-satin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Gold Watch Case Gradient -->
    <linearGradient id="watch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Watch Sapphire Crystal -->
    <radialGradient id="dial-sapphire" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
  </defs>

  <!-- Studio Canvas Background -->
  <rect width="500" height="500" fill="url(#studio-spot)" />
  <rect width="500" height="500" fill="url(#rim-amber)" />

  <!-- Subtle Minimalist Geometric Studio Grid -->
  <line x1="250" y1="30" x2="250" y2="470" stroke="#1f232d" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="250" cy="230" r="180" fill="none" stroke="#1c202a" stroke-width="1.5" />

  <!-- Sculptural Tailored Blazer / Overcoat Silhouette -->
  <g transform="translate(130, 75)">
    <!-- Shoulders & Torso Outline -->
    <path
      d="M20 330 L55 80 L95 100 L120 170 L145 100 L185 80 L220 330 Z"
      fill="url(#wool-fabric)"
      stroke="#4b505f"
      stroke-width="2"
    />

    <!-- Left Lapel (Satin) -->
    <path
      d="M55 80 L120 220 L100 220 L80 130 Z"
      fill="url(#lapel-satin)"
      stroke="#333742"
      stroke-width="1.5"
    />

    <!-- Right Lapel (Satin) -->
    <path
      d="M185 80 L120 220 L140 220 L160 130 Z"
      fill="url(#lapel-satin)"
      stroke="#333742"
      stroke-width="1.5"
    />

    <!-- Center Deep V Fold -->
    <path
      d="M95 100 L120 215 L145 100 Z"
      fill="#090a0d"
      stroke="#181a20"
      stroke-width="1.5"
    />

    <!-- Crisp White Shirt Collar Notch -->
    <polygon points="120,110 106,145 134,145" fill="#f8fafc" />
    <polygon points="120,125 110,150 130,150" fill="#e2e8f0" />

    <!-- Silk Pocket Square Accent -->
    <rect x="62" y="190" width="36" height="3" fill="#f59e0b" rx="1" />

    <!-- Horn Buttons -->
    <circle cx="120" cy="250" r="5" fill="#181a20" stroke="#525765" stroke-width="1" />
    <circle cx="120" cy="285" r="5" fill="#181a20" stroke="#525765" stroke-width="1" />
  </g>

  <!-- Luxury Minimalist Watch (Bottom Right Corner Hero Element) -->
  <g transform="translate(340, 310)">
    <!-- Watch Case Shadow -->
    <ellipse cx="60" cy="65" rx="55" ry="30" fill="#000000" opacity="0.5" />

    <!-- Leather Strap Top & Bottom -->
    <rect x="42" y="-15" width="36" height="35" rx="4" fill="#1c1917" stroke="#292524" stroke-width="1.5" />
    <rect x="42" y="95" width="36" height="40" rx="4" fill="#1c1917" stroke="#292524" stroke-width="1.5" />

    <!-- Gold Bezel Outer Ring -->
    <circle cx="60" cy="60" r="48" fill="url(#watch-gold)" stroke="#78350f" stroke-width="1.5" />
    <circle cx="60" cy="60" r="44" fill="#18181b" />

    <!-- Sapphire Sunburst Dial -->
    <circle cx="60" cy="60" r="40" fill="url(#dial-sapphire)" />

    <!-- Minimalist Hour Indices -->
    <line x1="60" y1="24" x2="60" y2="28" stroke="#fef08a" stroke-width="2" />
    <line x1="60" y1="92" x2="60" y2="96" stroke="#fef08a" stroke-width="2" />
    <line x1="24" y1="60" x2="28" y2="60" stroke="#fef08a" stroke-width="2" />
    <line x1="92" y1="60" x2="96" y2="60" stroke="#fef08a" stroke-width="2" />

    <!-- Sleek Dauphine Hands -->
    <line x1="60" y1="60" x2="60" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="60" x2="78" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="60" cy="60" r="3" fill="#f59e0b" />

    <!-- Crown -->
    <rect x="108" y="55" width="5" height="10" rx="1.5" fill="url(#watch-gold)" />
  </g>

  <!-- Film Vignette -->
  <rect width="500" height="500" fill="none" stroke="#000000" stroke-width="26" opacity="0.3" rx="16" />
</svg>
