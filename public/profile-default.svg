<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skin-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2b492" />
    </linearGradient>
    <linearGradient id="hair-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>
    <linearGradient id="shirt-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow-default" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="200" height="200" fill="url(#bg-grad-default)" />
  <circle cx="100" cy="85" r="70" fill="#3b82f6" opacity="0.15" />

  <!-- Body / Shoulders -->
  <g filter="url(#shadow-default)">
    <path d="M40 200 C40 155, 70 142, 100 142 C130 142, 160 155, 160 200 Z" fill="url(#shirt-default)" />
    <!-- Collar & Neck -->
    <path d="M86 130 L114 130 L110 152 L90 152 Z" fill="#e2b492" />
    <path d="M85 146 L100 162 L115 146 Z" fill="#0f172a" opacity="0.4" />
  </g>

  <!-- Head Base -->
  <g filter="url(#shadow-default)">
    <!-- Ears -->
    <circle cx="68" cy="100" r="10" fill="#e2b492" />
    <circle cx="132" cy="100" r="10" fill="#e2b492" />
    
    <!-- Face -->
    <rect x="72" y="62" width="56" height="74" rx="28" fill="url(#skin-default)" />

    <!-- Hair Back/Base -->
    <path d="M68 85 C66 60, 80 44, 100 44 C120 44, 134 60, 132 85 C124 74, 115 70, 100 70 C85 70, 76 74, 68 85 Z" fill="url(#hair-default)" />
    <!-- Styled Hair Swoop Top -->
    <path d="M68 66 C70 42, 86 36, 106 36 C124 36, 136 46, 134 62 C126 50, 114 48, 100 48 C84 48, 76 54, 68 66 Z" fill="#2d3748" />

    <!-- Eyebrows -->
    <path d="M78 84 Q87 81 94 85" stroke="#1a202c" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M106 85 Q113 81 122 84" stroke="#1a202c" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Glasses Frame -->
    <rect x="74" y="88" width="22" height="16" rx="4" fill="none" stroke="#0f172a" stroke-width="2.4" />
    <rect x="104" y="88" width="22" height="16" rx="4" fill="none" stroke="#0f172a" stroke-width="2.4" />
    <line x1="96" y1="94" x2="104" y2="94" stroke="#0f172a" stroke-width="2.4" />
    <!-- Glasses Reflection -->
    <path d="M77 91 L85 91 L79 101 L75 101 Z" fill="#ffffff" opacity="0.35" />
    <path d="M107 91 L115 91 L109 101 L105 101 Z" fill="#ffffff" opacity="0.35" />

    <!-- Eyes inside glasses -->
    <circle cx="85" cy="96" r="2.5" fill="#0f172a" />
    <circle cx="115" cy="96" r="2.5" fill="#0f172a" />

    <!-- Nose -->
    <path d="M98 102 Q100 109 103 109" stroke="#cf9c77" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Calm Confident Smile -->
    <path d="M90 118 Q100 124 110 118" stroke="#a06140" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Accent Status Ring Indicator -->
  <circle cx="158" cy="158" r="9" fill="#10b981" stroke="#ffffff" stroke-width="3" />
</svg>

