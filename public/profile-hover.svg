<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="skin-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdfc4" />
      <stop offset="100%" stop-color="#f0be9b" />
    </linearGradient>
    <linearGradient id="shirt-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e2f" />
    </linearGradient>
    <linearGradient id="sunglass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow-hover" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Vibrant Glow Background Canvas -->
  <rect width="200" height="200" fill="url(#bg-grad-hover)" />
  <circle cx="100" cy="80" r="75" fill="#ffffff" opacity="0.18" />

  <!-- Body / Shoulders -->
  <g filter="url(#shadow-hover)">
    <path d="M38 200 C38 150, 70 138, 100 138 C130 138, 162 150, 162 200 Z" fill="url(#shirt-hover)" />
    <!-- Collar & Neck -->
    <path d="M86 126 L114 126 L110 148 L90 148 Z" fill="#f0be9b" />
    <!-- Modern Tech Accent on Shirt -->
    <circle cx="100" cy="165" r="4" fill="#38bdf8" />
  </g>

  <!-- Head Base -->
  <g filter="url(#shadow-hover)">
    <!-- Ears with AirPod / Earbud -->
    <circle cx="68" cy="98" r="10" fill="#f0be9b" />
    <circle cx="132" cy="98" r="10" fill="#f0be9b" />
    <rect x="130" y="96" width="3" height="8" rx="1.5" fill="#ffffff" />
    
    <!-- Face -->
    <rect x="72" y="60" width="56" height="74" rx="28" fill="url(#skin-hover)" />

    <!-- Hair Back/Base -->
    <path d="M68 82 C66 58, 80 42, 100 42 C120 42, 134 58, 132 82 C124 72, 115 68, 100 68 C85 68, 76 72, 68 82 Z" fill="#18181b" />
    <!-- Fresh Textured Hair Swoop -->
    <path d="M66 64 C68 38, 86 32, 106 32 C126 32, 138 42, 136 60 C128 48, 114 46, 100 46 C84 46, 76 52, 66 64 Z" fill="#27272a" />
    <path d="M96 32 C104 28, 114 30, 120 34" stroke="#3f3f46" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cheerful Raised Eyebrows -->
    <path d="M78 80 Q87 75 94 80" stroke="#18181b" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M106 80 Q113 75 122 80" stroke="#18181b" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Sleek Gradient Aviator/Wayfarer Sunglasses -->
    <rect x="73" y="84" width="24" height="18" rx="5" fill="url(#sunglass-grad)" stroke="#09090b" stroke-width="2" />
    <rect x="103" y="84" width="24" height="18" rx="5" fill="url(#sunglass-grad)" stroke="#09090b" stroke-width="2" />
    <line x1="97" y1="90" x2="103" y2="90" stroke="#09090b" stroke-width="2.5" />
    <!-- Gradient Lens Flare / Shine Line -->
    <line x1="75" y1="87" x2="94" y2="99" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="105" y1="87" x2="124" y2="99" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Nose -->
    <path d="M98 102 Q100 108 103 108" stroke="#cf9c77" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Big Warm Joyful Smile with Teeth -->
    <path d="M88 116 Q100 130 112 116 Z" fill="#ffffff" stroke="#991b1b" stroke-width="1.5" />
    <path d="M88 116 Q100 120 112 116" stroke="#991b1b" stroke-width="1.5" fill="none" />
    
    <!-- Cheerful Cheek Blush -->
    <ellipse cx="76" cy="112" rx="4" ry="2" fill="#f43f5e" opacity="0.3" />
    <ellipse cx="124" cy="112" rx="4" ry="2" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Sparkle Accent on Top Right -->
  <path d="M165 45 L168 52 L175 55 L168 58 L165 65 L162 58 L155 55 L162 52 Z" fill="#fde047" />
  <circle cx="150" cy="40" r="2" fill="#fde047" />
</svg>

